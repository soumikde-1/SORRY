<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonu Loves Misti ❤️</title>
    <style>
        body {
            background-color: #ffe6f2;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            color: #ff4d94;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .poem {
            background: #fff0f5;
            padding: 20px;
            border-radius: 15px;
            font-style: italic;
            color: #d63384;
            font-size: 18px;
            line-height: 1.8;
            margin: 20px 0;
            border-left: 5px solid #ff4d94;
            text-align: center;
            font-weight: bold;
        }
        .message {
            color: #555;
            font-size: 17px;
            margin-bottom: 25px;
            font-weight: bold;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            margin: 10px;
        }
        #yes-btn {
            background-color: #ff4d94;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 77, 148, 0.4);
        }
        #yes-btn:hover {
            background-color: #e6005c;
            transform: scale(1.05);
        }
        #no-btn {
            background-color: #f2f2f2;
            color: #555;
            position: relative;
        }
        .success-message {
            color: #ff4d94;
            font-size: 24px;
            font-weight: bold;
            animation: popIn 0.5s ease-out;
            line-height: 1.5;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h1>মিষ্টি আর সোনুর গল্প ❤️</h1>
        
        <div class="poem">
            সোনুর মনে একটাই আশা, মিষ্টির একটু হাসি,<br>
            সব অভিমান ভুলে যাও, তোমায় বড্ড ভালোবাসি।<br>
            মিষ্টি মেয়ের মিষ্টি হাসিতে, সোনুর কাটে দিন,<br>
            তুমি ছাড়া সোনুর পৃথিবী, একদম যে রঙহীন!
        </div>

        <p class="message">এবার তো রাগ ভাঙো আমার মিষ্টি পাখি! প্লিজ?</p>
        
        <button id="yes-btn" onclick="forgiveMe()">ভালোবাসি সোনু ❤️</button>
        <button id="no-btn" onmouseover="moveButton()" onclick="moveButton()">এখনো রাগ! 😤</button>
    </div>

    <script>
        // "এখনো রাগ" বাটন পালানোর লজিক
        function moveButton() {
            const noBtn = document.getElementById('no-btn');
            
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // "ভালোবাসি সোনু" বাটনের লজিক
        function forgiveMe() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <div class="success-message">
                    <h1>Yayyy! 🎉</h1>
                    <p>আমিও তোমায় অনেক ভালোবাসি মিষ্টি! ❤️<br>সোনু আর কখনো তোমাকে কষ্ট দেবে না।</p>
                </div>
            `;
        }
    </script>

</body>
</html>
