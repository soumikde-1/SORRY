<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonu Loves Misti ❤️</title>
    <style>
        body {
            background-color: #ffe6f2;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            color: #ff4d94;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .poem {
            background: #fff0f5;
            padding: 20px;
            border-radius: 15px;
            font-style: italic;
            color: #d63384;
            font-size: 18px;
            line-height: 1.8;
            margin: 20px 0;
            border-left: 5px solid #ff4d94;
            text-align: center;
            font-weight: bold;
        }
        .message {
            color: #555;
            font-size: 17px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* --- BUTTON BASIC STYLES --- */
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
            position: relative;
            outline: none;
        }

        /* --- FEATURE 1: GLOWING ANIMATION FOR BOTH BUTTONS --- */
        @keyframes buttonGlowPulse {
            0% { box-shadow: 0 0 5px rgba(255, 77, 148, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 77, 148, 0.9); }
            100% { box-shadow: 0 0 5px rgba(255, 77, 148, 0.5); }
        }

        #yes-btn {
            background-color: #ff4d94;
            color: white;
            animation: buttonGlowPulse 2s infinite ease-in-out;
        }
        #yes-btn:hover {
            background-color: #e6005c;
            transform: scale(1.05);
            animation: buttonGlowPulse 1s infinite ease-in-out; /* Speed up on hover */
        }

        #no-btn {
            background-color: #f2f2f2;
            color: #555;
            position: relative;
            animation: buttonGlowPulse 2.5s infinite ease-in-out; /* Slower initial glow */
        }
        #no-btn:hover {
            animation: buttonGlowPulse 0.5s infinite ease-in-out; /* Fast glow on interaction */
        }

        /* --- FEATURE 2: FLOATING 'SORRY' STYLES --- */
        .sorry-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background-color: rgba(214, 51, 132, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: none; /* User can't click through it */
        }
        .sorry-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- FEATURE 3: COLOR BLINKING ANIMATION FOR YES BUTTON --- */
        @keyframes colorBlink {
            0% { background-color: #ff4d94; box-shadow: 0 0 25px #ff4d94; }
            20% { background-color: #ffcc00; box-shadow: 0 0 25px #ffcc00; }
            40% { background-color: #33cc33; box-shadow: 0 0 25px #33cc33; }
            60% { background-color: #3399ff; box-shadow: 0 0 25px #3399ff; }
            80% { background-color: #cc33ff; box-shadow: 0 0 25px #cc33ff; }
            100% { background-color: #ff4d94; box-shadow: 0 0 25px #ff4d94; }
        }
        .blink-colors {
            animation: colorBlink 0.3s infinite linear !important; /* Extremely fast blink */
            color: black !important; /* Ensure text is visible during blink */
        }

        /* Success Message Styling */
        .success-message {
            color: #ff4d94;
            font-size: 24px;
            font-weight: bold;
            animation: popIn 0.5s ease-out;
            line-height: 1.5;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="sorry-popup" class="sorry-popup">
        বড্ড ভুল হয়ে গেছে,<br>
        Sorry Misti! 🥺
    </div>

    <div class="card" id="main-card">
        <h1>মিষ্টি আর SONU -র গল্প ❤️</h1>
        
        <div class="poem">
           sonu-র মনে একটাই আশা, মিষ্টির একটু হাসি,<br>
           সব অভিমান ভুলে যাও, তোমায় বড্ড ভালোবাসি।<br>
           মিষ্টি মেয়ের মিষ্টি হাসিতে, sonu-র কাটে দিন,<br>
           তুমি ছাড়া sonu-র পৃথিবী, एकदम যে রঙহীন!
        </div>

        <p class="message">এবার তো রাগ ভাঙো আমার মিষ্টি পাখি! প্লিজ?</p>
        
        <button id="yes-btn" onclick="forgiveMe()">ভালোবাসি sonu ❤️</button>
        <button id="no-btn" onmouseover="handleNoInteraction()" onclick="handleNoInteraction()">এখনো রাগ ! 😤</button>
    </div>

    <script>
        // --- FEATURE 2 Logic: Show 'Sorry' text ---
        function showSorryPopup() {
            const popup = document.getElementById('sorry-popup');
            popup.classList.add('show');
            
            // Hide the popup after 1.5 seconds
            setTimeout(() => {
                popup.classList.remove('show');
            }, 1500);
        }

        // --- Core logic when user interacts with "No" button ---
        function handleNoInteraction() {
            // First, move the button
            moveButton();
            // Second, show the "Sorry" popup
            showSorryPopup();
        }

        // --- Existing Logic: "এখনো রাগ" বাটন পালানোর লজিক ---
        function moveButton() {
            const noBtn = document.getElementById('no-btn');
            
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // --- FEATURE 3 Logic: "ভালোবাসি sonu" বাটনের ব্লিঙ্কিং এবং ডিলে ---
        function forgiveMe() {
            const yesBtn = document.getElementById('yes-btn');
            const card = document.getElementById('main-card');

            // 1. Add the blinking class to the button
            yesBtn.classList.add('blink-colors');

            // 2. Wait for 3 seconds (3000 milliseconds) before changing the content
            setTimeout(() => {
                card.innerHTML = `
                    <div class="success-message">
                        <h1> Thank you MuM 🎉</h1>
                        <p>আমিও তোমায় অনেক ভালোবাসি মিষ্টি! ❤️<br> sonu আর কখনো তোমাকে কষ্ট দেবে না।</p>
                    </div>
                `;
            }, 3000); // 3 seconds delay
        }
    </script>

</body>
</html>
